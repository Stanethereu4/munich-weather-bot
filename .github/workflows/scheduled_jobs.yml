name: Munich Weather Bot - Scheduled Logging

# How logging stays continuous:
#   GitHub's cron is best-effort (overnight on 24-25 Nov it fired zero
#   times in 8 hours), so the `logger` job keeps itself alive:
#   - it runs for ~5h40m, looping internally: a price snapshot every
#     quarter hour, a full model run + settlement every 4 hours;
#   - its last step starts the NEXT logger run via the GitHub API
#     (workflow_dispatch is the one event a workflow may trigger with its
#     own GITHUB_TOKEN), so the chain continues on its own;
#   - the hourly cron stays as a backup restart if the chain ever breaks.
#   Only one logger runs at a time (concurrency group, max one waiting).
#   To STOP logging: Actions tab -> this workflow -> "..." -> Disable workflow.
#   (Repo is public -> Actions minutes are free.)
#
# GitHub auto-disables scheduled workflows after 60 days without a push
# to the repo. Check the Actions tab occasionally.

on:
  schedule:
    - cron: "7 * * * *"      # hourly: keep a logger running / queued
    - cron: "17 3 * * 1"     # weekly lead-time calibration
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: logging
        options:
          - logging          # start the long-running logger loop
          - once             # one price snapshot + one full run, then stop (testing)
          - calibrate        # measure forecast error per horizon -> leadtime_calibration
          - check-station    # compare EDDM station sources for the last 7 days (read-only)
          - probe            # print real API response structures (tools/probe_apis.py)
          - dry-run          # full pipeline on a throwaway SQLite DB (production DB untouched)
      loop_minutes:
        description: "For task=logging: how long this logger loops (default 340 = 5h40m; small values for testing)"
        type: string
        default: "340"
      probe_args:
        description: "For task=probe: which probes to run (space-separated, empty = default set)"
        type: string
        default: ""

env:
  PYTHONUNBUFFERED: "1"   # print output immediately (otherwise lost if a run is killed)

jobs:
  logger:
    if: >-
      github.event.schedule == '7 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'logging')
    concurrency:
      group: logger
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write     # needed to start the next logger run (self-chaining)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Logging loop (prices every 15 min, full run every 4 h)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Scheduled runs have no inputs -> default 340 minutes.
          minutes="${{ inputs.loop_minutes || '340' }}"
          case "$minutes" in ''|*[!0-9]*) echo "loop_minutes must be a whole number"; exit 1;; esac
          stop_at=$(( $(date +%s) + minutes*60 ))
          last_full=0
          while [ "$(date +%s)" -lt "$stop_at" ]; do
            now=$(date +%s)
            echo "::group::$(date -u +%FT%TZ) price snapshot"
            timeout 300 python3 munich_bot.py --prices-only || echo "[loop] price snapshot failed or timed out (5 min)"
            echo "::endgroup::"
            if [ $(( now - last_full )) -ge $(( 4*3600 - 300 )) ]; then
              echo "::group::$(date -u +%FT%TZ) full model run + settlement"
              timeout 600 python3 munich_bot.py || echo "[loop] full run failed or timed out (10 min)"
              echo "::endgroup::"
              last_full=$now
            fi
            sleep $(( 900 - $(date +%s) % 900 ))   # wake at the next quarter hour
          done
      - name: Start the next logger run (self-chaining)
        # success() || failure(): chain on, but NOT if someone cancelled this run on purpose.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f task=logging

  once:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Price snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py --prices-only
      - name: Full model run + settlement
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py

  maintenance:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'calibrate' || inputs.task == 'check-station' || inputs.task == 'probe' ||
        inputs.task == 'dry-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare station sources
        if: inputs.task == 'check-station'
        run: python3 station_obs.py
      - name: Probe external APIs (read-only)
        if: inputs.task == 'probe'
        run: python3 tools/probe_apis.py ${{ inputs.probe_args }}
      - name: Dry run on throwaway SQLite (no DATABASE_URL -> production DB untouched)
        if: inputs.task == 'dry-run'
        run: |
          python3 Lead_Time_Sensitivity.py
          python3 munich_bot.py --prices-only
          python3 munich_bot.py
          python3 station_obs.py
          python3 tools/dry_run_report.py
      - name: Measure lead-time calibration
        if: github.event_name == 'schedule' || inputs.task == 'calibrate'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 Lead_Time_Sensitivity.py
