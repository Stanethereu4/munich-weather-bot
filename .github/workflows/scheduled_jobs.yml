name: Munich Weather Bot - Scheduled Logging

# How logging stays continuous:
#   GitHub's cron is best-effort (overnight on 24-25 Nov it fired zero
#   times in 8 hours), so the `logger` job keeps itself alive:
#   - it runs for ~5h40m, looping internally: a price snapshot every
#     quarter hour, a full model run + settlement every 4 hours;
#   - its last step starts the NEXT logger run via the GitHub API
#     (workflow_dispatch is the one event a workflow may trigger with its
#     own GITHUB_TOKEN), so the chain continues on its own;
#   - the hourly cron stays as a backup restart if the chain ever breaks.
#   Only one logger runs at a time (concurrency group, max one waiting).
#   To STOP logging: Actions tab -> this workflow -> "..." -> Disable workflow.
#   (Repo is public -> Actions minutes are free.)
#
# GitHub auto-disables scheduled workflows after 60 days without a push
# to the repo. Check the Actions tab occasionally.

on:
  schedule:
    - cron: "7 * * * *"      # hourly: keep a logger running / queued
    - cron: "17 3 * * 1"     # weekly lead-time calibration
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: logging
        options:
          - logging          # start the long-running logger loop
          - once             # one price snapshot + one full run, then stop (testing)
          - calibrate        # measure forecast error per horizon -> leadtime_calibration
          - check-station    # compare EDDM station sources for the last 7 days (read-only)
          - probe            # print real API response structures (tools/probe_apis.py)
          - dry-run          # full pipeline on a throwaway SQLite DB (production DB untouched)
          - backtest         # run one backtest script (backtest_args), save backtest_data/ as an artifact
          - arb-scan         # read-only scan of logged order books for riskless combinations (tools/arb_scan.py)
          - paper            # live PAPER trading loop, Kalshi -> Polymarket lead-lag (livepaper/), self-chaining
      backtest_args:
        description: "For task=backtest: module + args, e.g. 'markets' or 'prices'"
        type: string
        default: "markets"
      from_run:
        description: "For task=backtest: start from the backtest_data artifact of this run id (optional)"
        type: string
        default: ""
      loop_minutes:
        description: "For task=logging: how long this logger loops (default 340 = 5h40m; small values for testing)"
        type: string
        default: "340"
      probe_args:
        description: "For task=probe: which probes to run (space-separated, empty = default set)"
        type: string
        default: ""

env:
  PYTHONUNBUFFERED: "1"   # print output immediately (otherwise lost if a run is killed)

jobs:
  logger:
    if: >-
      github.event.schedule == '7 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'logging')
    concurrency:
      group: logger
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write     # needed to start the next logger run (self-chaining)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Logging loop (prices every 15 min, full run every 4 h)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Scheduled runs have no inputs -> default 340 minutes.
          minutes="${{ inputs.loop_minutes || '340' }}"
          case "$minutes" in ''|*[!0-9]*) echo "loop_minutes must be a whole number"; exit 1;; esac
          stop_at=$(( $(date +%s) + minutes*60 ))
          last_full=0
          while [ "$(date +%s)" -lt "$stop_at" ]; do
            now=$(date +%s)
            echo "::group::$(date -u +%FT%TZ) price snapshot"
            timeout 300 python3 munich_bot.py --prices-only || echo "[loop] price snapshot failed or timed out (5 min)"
            echo "::endgroup::"
            if [ $(( now - last_full )) -ge $(( 4*3600 - 300 )) ]; then
              echo "::group::$(date -u +%FT%TZ) full model run + settlement"
              timeout 600 python3 munich_bot.py || echo "[loop] full run failed or timed out (10 min)"
              echo "::endgroup::"
              last_full=$now
            fi
            sleep $(( 900 - $(date +%s) % 900 ))   # wake at the next quarter hour
          done
      - name: Start the next logger run (self-chaining)
        # success() || failure(): chain on, but NOT if someone cancelled this run on purpose.
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f task=logging

  paper:
    # Live PAPER trading of the Kalshi -> Polymarket lead-lag strategy (no orders are ever placed).
    # Loops for loop_minutes (default 340), checking both platforms every minute, then starts
    # the next run itself (same trick as the logger). Publishes the dashboard to the `dashboard`
    # branch every 10 minutes (GitHub Pages). To STOP: cancel the running "paper" run.
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'paper'
    concurrency:
      group: paper
      cancel-in-progress: false
    permissions:
      contents: write    # push the dashboard branch
      actions: write     # start the next paper run (self-chaining)
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Paper trading loop (every minute)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          minutes="${{ inputs.loop_minutes || '340' }}"
          case "$minutes" in ''|*[!0-9]*) echo "loop_minutes must be a whole number"; exit 1;; esac
          python3 -m livepaper.engine "$minutes"
      - name: Start the next paper run (self-chaining)
        if: (success() || failure()) && inputs.loop_minutes == '340'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" -f task=paper -f loop_minutes=340

  once:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Price snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py --prices-only
      - name: Full model run + settlement
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py

  maintenance:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'calibrate' || inputs.task == 'check-station' || inputs.task == 'probe' ||
        inputs.task == 'dry-run' || inputs.task == 'arb-scan'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare station sources
        if: inputs.task == 'check-station'
        run: python3 station_obs.py
      - name: Probe external APIs (read-only)
        if: inputs.task == 'probe'
        run: python3 tools/probe_apis.py ${{ inputs.probe_args }}
        env:
          PMDATA_API_KEY: ${{ secrets.PMDATA_API_KEY }}       # only used by the pmdata probe
      - name: Dry run on throwaway SQLite (no DATABASE_URL -> production DB untouched)
        if: inputs.task == 'dry-run'
        run: |
          python3 Lead_Time_Sensitivity.py
          python3 munich_bot.py --prices-only
          python3 munich_bot.py
          python3 station_obs.py
          python3 tools/dry_run_report.py
      - name: Scan logged order books for free-money combinations (SELECT only)
        if: inputs.task == 'arb-scan'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 tools/arb_scan.py
      - name: Measure lead-time calibration
        if: github.event_name == 'schedule' || inputs.task == 'calibrate'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 Lead_Time_Sensitivity.py

  backtest:
    # Historical backtest data (Part C). Reads public APIs only; never
    # touches the production database. Data lives on the separate
    # 'backtest-data' branch (never merged into main): each run starts from
    # what is already there and pushes its new/updated files back.
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'backtest'
    concurrency:
      group: backtest-data     # one writer at a time
      cancel-in-progress: false
    permissions:
      contents: write          # push to the backtest-data branch
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pyarrow
      - name: Get existing backtest data (branch backtest-data, if it exists)
        run: |
          if git ls-remote --exit-code --heads origin backtest-data >/dev/null; then
            git fetch --depth 1 origin backtest-data
            git worktree add /tmp/bd origin/backtest-data
          else
            git worktree add --detach /tmp/bd
            (cd /tmp/bd && git checkout --orphan tmp-bd && git rm -rfq . )
          fi
          mkdir -p /tmp/bd/backtest_data
          ln -s /tmp/bd/backtest_data backtest_data
      - name: Run backtest step
        env:
          TELONEX_API_KEY: ${{ secrets.TELONEX_API_KEY }}     # only used by backtest/telonex_books.py
        run: python3 -m backtest.${{ inputs.backtest_args }}
      - name: Save to the backtest-data branch
        if: always()
        run: |
          cd /tmp/bd
          git add -A backtest_data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="backtest bot" -c user.email="actions@users.noreply.github.com" \
              commit -qm "backtest data: ${{ inputs.backtest_args }} (run ${{ github.run_id }})"
          git push -q origin HEAD:refs/heads/backtest-data
