name: Munich Weather Bot - Scheduled Logging

# How logging stays continuous:
#   GitHub's cron is best-effort and skips most 15-minute triggers, so
#   instead of one short run per snapshot, the `logger` job runs for
#   ~5h50m and loops internally: a price snapshot every quarter hour,
#   a full model run + settlement every 4 hours. An hourly trigger
#   queues the next logger (concurrency group, max one waiting), so
#   when one finishes the next starts right away. Even if GitHub drops
#   most hourly triggers, one getting through every ~6h is enough.
#   (Repo is public -> Actions minutes are free.)
#
# GitHub auto-disables scheduled workflows after 60 days without a push
# to the repo. Check the Actions tab occasionally.

on:
  schedule:
    - cron: "7 * * * *"      # hourly: keep a logger running / queued
    - cron: "17 3 * * 1"     # weekly lead-time calibration
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: logging
        options:
          - logging          # start the long-running logger loop
          - once             # one price snapshot + one full run, then stop (testing)
          - calibrate        # measure forecast error per horizon -> leadtime_calibration
          - check-station    # compare EDDM station sources for the last 7 days (read-only)

env:
  PYTHONUNBUFFERED: "1"   # print output immediately (otherwise lost if a run is killed)

jobs:
  logger:
    if: >-
      github.event.schedule == '7 * * * *' ||
      (github.event_name == 'workflow_dispatch' && inputs.task == 'logging')
    concurrency:
      group: logger
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Logging loop (prices every 15 min, full run every 4 h)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          stop_at=$(( $(date +%s) + 5*3600 + 40*60 ))
          last_full=0
          while [ "$(date +%s)" -lt "$stop_at" ]; do
            now=$(date +%s)
            echo "::group::$(date -u +%FT%TZ) price snapshot"
            timeout 300 python3 munich_bot.py --prices-only || echo "[loop] price snapshot failed or timed out (5 min)"
            echo "::endgroup::"
            if [ $(( now - last_full )) -ge $(( 4*3600 - 300 )) ]; then
              echo "::group::$(date -u +%FT%TZ) full model run + settlement"
              timeout 600 python3 munich_bot.py || echo "[loop] full run failed or timed out (10 min)"
              echo "::endgroup::"
              last_full=$now
            fi
            sleep $(( 900 - $(date +%s) % 900 ))   # wake at the next quarter hour
          done

  once:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Price snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py --prices-only
      - name: Full model run + settlement
        timeout-minutes: 10
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 munich_bot.py

  maintenance:
    if: >-
      github.event.schedule == '17 3 * * 1' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.task == 'calibrate' || inputs.task == 'check-station'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare station sources
        if: inputs.task == 'check-station'
        run: python3 station_obs.py
      - name: Measure lead-time calibration
        if: github.event_name == 'schedule' || inputs.task == 'calibrate'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 Lead_Time_Sensitivity.py
